services:
  postgres:
    image: postgres:16
    container_name: logistream-postgres
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical",
              "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes:
      - D:/logistream/data/pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: logistream-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  connect:
    image: quay.io/debezium/connect:2.7
    container_name: logistream-connect
    depends_on:
      - redpanda
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: logistream-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms256M -Xmx1G"

  spark:
    build: ./spark
    container_name: logistream-spark
    profiles: ["tools"]
    depends_on:
      - redpanda
    mem_limit: 3g
    volumes:
      - ./spark:/app
      - D:/logistream/lake:/lake
      - spark-ivy:/root/.ivy2

volumes:
  redpanda-data:
  spark-ivy:
